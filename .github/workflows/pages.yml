# Eski (Jekyll) Pages derleyicisi 6 Ağustos'ta iki kez "Page build failed"
# verdi: müzik eklenince .pck 8 MB'tan 12 MB'a çıkmıştı ve o günden beri
# canlıda 5 Ağustos derlemesi duruyordu. Bu iş akışı artifact yolunu kullanır
# (GB ölçeğinde tavan), böylece paket büyüdükçe yayın sessizce eskimez.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
